<!DOCTYPE html>
<html lang="pt=br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
        }
        div.item{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">Conteudo Maior</div>
        <div class="item">D</div>
        <div class="item">Conteudo Maior Ainda</div>
        <div class="item">F</div>
        <div class="item">Conteudo Maior ainda que vai oculpar mais espaço</div>

    </div>
    
</body>
</html>
