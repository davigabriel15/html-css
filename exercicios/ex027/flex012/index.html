<!DOCTYPE html>
<html lang="pt=br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        /* ShortHands: 
        flex: flex-grow + flex-shrink + flex-basis */

        div.container{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
        div#cxA{
            /*flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 250px;*/

            flex: 1 1 250px;
        }
        div#cxB{
            flex-grow: 4;
            flex-shrink: 1;
            flex-basis: 250px;
        }
        div#cxC{
            flex-grow: 1;
            flex-shrink: 4;
            flex-basis: 250px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
    
</body>
</html>
