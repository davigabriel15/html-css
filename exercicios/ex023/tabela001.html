<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;

        }
        table{
            border: 1px solid Black;
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            background-color: blue;
        }

        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            vertical-align: bottom;
        }
        .numero{text-align: right;}
    </style>
</head>
<body>
    <h1>Minha primeira Tabela</h1>

        <!-- Hierarquia de tabela (simples)
        Table = Tabela
            Table row = linha de tabela
            table header = Cabeçalho de tabela
            Table data = dadp de tabela
-->
        
    <table>
        <tr><!--primeira linha -->
                <td>a1</td>
                <td>b1</td>
                <td>c1</td>
        </tr>
        <tr>
            <td>a2</td>
            <td class="numero">b2</td>
            <td>c2</td>
        </tr>
        <tr>
            <td>a3</td>
            <td>b3</td>
            <td>c3</td>
        </tr>
        <tr>
            <td>a4</td>
            <td class="numero">b4</td>
            <td>c4</td>
        </tr>


    </table>
    
</body>
</html>
