<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de media queries</title>
    <style>
        /* As configuraçoes abaixo também podem ser realizadas
        em um unico arquivo CSS */
        /* Declaraçoes gerais */
    *{
    margin: 0px;
    padding: 0px;
    font-family: Arial, Helvetica, sans-serif;
    }
    html, body{
        width: 100vw;
        height: 100vh;
        background-color: #233eff;
        background-size: contain;
        background-repeat: no-repeat;
    }
    h1{
        color: white;
        text-shadow: 2px 2px 0px #233eff;
        padding: 10px;
    }
        /* Declaraçoes retrato */
    @media screen and (orientation: portrait) {
        body{
            background: url(../imagens/cev-portrait.jpg);
            background-position: center bottom;
            background-repeat: no-repeat;
            background-size: contain;
        }
    
    }
    /* Declaraçoes de Paisagem */
    @media screen and (orientation: landscape) {
        body{
            background: url(../imagens/cev-landscape.jpg);
            background-position: left bottom;
            background-repeat: no-repeat;
            background-size: contain;
        }
    }
    </style>

</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
    
</body>
</html>
